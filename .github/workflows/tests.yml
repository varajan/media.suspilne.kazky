on:
  workflow_call:

jobs:
  tests:
    name: Google Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !tales/
            !colorings/
          sparse-checkout-cone-mode: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab Robo Test
        id: testlab
        run: |
          gcloud firebase test android run \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --device model=oriole,version=33,locale=uk,orientation=portrait \
            --timeout 3m \
            --results-bucket=${{ secrets.GCP_STORAGE_BUCKET }} \
            --results-dir=test-results-${{ github.run_id }} \
            --verbosity=info

      - name: Download test logs and video from GCS
        if: always()
        run: |
          mkdir -p test-artifacts
          gcloud storage cp -r gs://${{ secrets.GCP_STORAGE_BUCKET }}/test-results-${{ github.run_id }}/* test-artifacts/

      - name: Upload Test Video and Logs to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-robo-test-results
          path: test-artifacts/
          retention-days: 7
          
